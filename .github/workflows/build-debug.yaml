name: Build Debug
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  BuildDebug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      # Secrets are unavailable for pull requests from forks, so this workflow
      # signs only when they are present and says so loudly when they are not.
      - name: Setup signing keystore
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > release.keystore
          fi

          if [ -z "${SIGNING_STORE_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_ALIAS:-}" ] || [ -z "${SIGNING_KEY_PASSWORD:-}" ] || [ ! -f release.keystore ]; then
            echo "::warning title=Debug signing::Signing secrets unavailable (expected for fork pull requests). This APK will be signed with a throwaway debug key and will NOT be able to update any other build."
            rm -f signing.properties
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'keystore.password=%s\nkey.alias=%s\nkey.password=%s\n' \
            "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_ALIAS" "$SIGNING_KEY_PASSWORD" > signing.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Keystore ready, alias: $SIGNING_KEY_ALIAS"

      - name: Build
        if: success()
        run: ./gradlew --no-daemon app:assembleAlphaRelease

      - name: Report APK signing certificate
        if: success()
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -x "$APKSIGNER" ] || { echo "::error::apksigner not found"; exit 1; }

          shopt -s nullglob
          apks=(app/build/outputs/apk/alpha/release/*.apk)
          [ ${#apks[@]} -gt 0 ] || { echo "::error::no APK was produced"; exit 1; }

          for apk in "${apks[@]}"; do
            cert=$("$APKSIGNER" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            echo "$(basename "$apk") -> $cert"
          done
          
      - name: Signing summary
        if: always()
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            echo "### APK signed with the release keystore" >> "$GITHUB_STEP_SUMMARY"
            echo "It can update any build signed with the same key." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### APK signed with a throwaway debug key" >> "$GITHUB_STEP_SUMMARY"
            echo "It cannot update any other build - install it after uninstalling the previous one." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Aritfact (universal)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: CMFA alpha APK (universal) 
          path: |
            app/build/outputs/apk/alpha/release/*-universal-*.apk
      
      - name: Upload Aritfact (arm64-v8a)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: CMFA alpha APK (arm64-v8a)
          path: |
            app/build/outputs/apk/alpha/release/*-arm64-v8a-*.apk
      
      - name: Upload Aritfact (armeabi-v7a)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: CMFA alpha APK (armeabi-v7a)
          path: |
            app/build/outputs/apk/alpha/release/*-armeabi-v7a-*.apk
      
      - name: Upload Aritfact (x86_64)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: CMFA alpha APK (x86_64)
          path: |
            app/build/outputs/apk/alpha/release/*-x86_64-*.apk
      
      - name: Upload Aritfact (x86)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: CMFA alpha APK (x86)
          path: |
            app/build/outputs/apk/alpha/release/*-x86-*.apk
