name: Build Pre-Release
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  BuildPreRelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Setup signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=""
          [ -n "${SIGNING_STORE_PASSWORD:-}" ] || missing="$missing SIGNING_STORE_PASSWORD"
          [ -n "${SIGNING_KEY_ALIAS:-}" ]     || missing="$missing SIGNING_KEY_ALIAS"
          [ -n "${SIGNING_KEY_PASSWORD:-}" ]  || missing="$missing SIGNING_KEY_PASSWORD"
          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > release.keystore
          elif [ ! -f release.keystore ]; then
            missing="$missing SIGNING_KEYSTORE_BASE64"
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Signing not configured::Missing secrets:$missing"
            echo "Without them gradle falls back to the debug keystore, which GitHub regenerates with a random key on every run - so each APK has a different signature and can never update an existing install."
            echo "Add these repository secrets: SIGNING_KEYSTORE_BASE64 (base64 of your .keystore),"
            echo "SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD."
            exit 1
          fi

          printf 'keystore.password=%s\nkey.alias=%s\nkey.password=%s\n' \
            "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_ALIAS" "$SIGNING_KEY_PASSWORD" > signing.properties

          keytool -list -v -keystore release.keystore \
            -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" \
            | grep -E "^(Alias name|Valid from|SHA256):" \
            || { echo "::error::release.keystore does not match SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS"; exit 1; }
          echo "Keystore ready, alias: $SIGNING_KEY_ALIAS"

      - name: Pre-release Build
        if: success()
        run: ./gradlew --no-daemon app:assembleAlphaRelease

      - name: Verify APK signing certificate
        if: success()
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -x "$APKSIGNER" ] || { echo "::error::apksigner not found"; exit 1; }

          shopt -s nullglob
          apks=(app/build/outputs/apk/alpha/release/*.apk)
          [ ${#apks[@]} -gt 0 ] || { echo "::error::no APK was produced"; exit 1; }

          for apk in "${apks[@]}"; do
            cert=$("$APKSIGNER" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            echo "$(basename "$apk") -> $cert"
            if [ -n "${EXPECTED_CERT_SHA256:-}" ] && [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error file=$apk::signed by $cert, expected $EXPECTED_CERT_SHA256"
              exit 1
            fi
          done
          echo "All APKs carry the expected signing certificate."

      # Delete old Prerelease-alpha
      - uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: Prerelease-alpha
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true

      - name: Tag Repo
        uses: richardsimko/update-tag@v3
        with:
          tag_name: Prerelease-alpha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Alpha
        uses: softprops/action-gh-release@v3
        if: ${{  success() }}
        with:
          tag_name: Prerelease-alpha
          files: app/build/outputs/apk/alpha/release/*
          prerelease: true
          generate_release_notes: true

      - name: Release Changelog Builder
        uses: mikepenz/release-changelog-builder-action@v6
